name: Test

on:
  push:
    branches: [main, develop, migration/istar-ts]
  pull_request:
    branches: [main, develop, migration/istar-ts]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Anything to check?
        id: affected
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/ci/affected.sh test

      - name: Install pnpm
        if: steps.affected.outputs.run == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Set up Node.js
        if: steps.affected.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.affected.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: steps.affected.outputs.run == 'true'
        run: pnpm test

      - name: Install Playwright Chromium
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter @goal-controller/ui exec playwright install --with-deps chromium

      - name: Run e2e
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter @goal-controller/ui run e2e

