name: PRISM Model Test

on:
  push:
    branches: [main, develop, migration/istar-ts]
  pull_request:
    branches: [main, develop, migration/istar-ts]
  workflow_dispatch:

jobs:
  test-prism-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Anything to check?
        id: affected
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/ci/affected.sh prism

      - name: Set up QEMU for ARM emulation
        if: steps.affected.outputs.run == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.affected.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for ARM
        if: steps.affected.outputs.run == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./experiments/Dockerfile.prism
          platforms: linux/arm64
          load: true
          tags: goal-controller-prism:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run PRISM test in Docker
        if: steps.affected.outputs.run == 'true'
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            goal-controller-prism:latest \
            bash -c "corepack enable && corepack prepare pnpm@8.15.0 --activate && pnpm install --frozen-lockfile && make generate FILE=examples/edge/experiments/goalModel_TAS_3/goalModel_TAS_3.txt && bash experiments/prism-parse.sh output/goalModel_TAS_3.prism"
